name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"   # fija; >= 0.13.4 por incidente eMudhra/emSign
          enable-cache: true

      - name: Lockfile al día con pyproject.toml
        run: uv lock --check

      - name: Sync dependencies (locked)
        run: uv sync --frozen --all-groups

      - name: Lint (ruff)
        run: uv run --frozen ruff check .

      - name: Type check (mypy)
        run: uv run --frozen mypy app/ --ignore-missing-imports

      - name: Security scan (bandit)
        run: uv run --frozen bandit -r app/ -ll -q

      - name: Dependency audit (pip-audit)
        run: |
          uv export --frozen --all-groups --all-extras --no-emit-project > /tmp/requirements.txt
          uv run --frozen pip-audit -r /tmp/requirements.txt --disable-pip --no-deps

      - name: Tests + coverage (pytest)
        run: uv run --frozen pytest -q --cov=app --cov-report=term-missing --cov-fail-under=60
