services:
  # 1. La API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uv run --frozen uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    environment:
      - MOCK_MODE=true
      - OPENAI_BASE_URL=http://mock-llm:8001/v1  # Apuntamos al Mock
      - OPENAI_API_KEY=sk-mock-key-123
    depends_on:
      - mock-llm

  # 2. El Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    command: uv run --frozen streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    environment:
      - BACKEND_URL=http://backend:8000

  # 3. El Mock LLM
  # Reutiliza la imagen del backend: mismas dependencias del uv.lock (versiones
  # fijas y auditadas). Antes hacía `pip install` sin versión dentro de
  # python:3.12-slim, con un pip vulnerable al incidente eMudhra/emSign.
  mock-llm:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uv run --frozen uvicorn app.mock_llm:mock_app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]
